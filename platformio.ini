[env:andromeda_esp32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit seesaw Library @ ^1.7.9
    mikalhart/TinyGPSPlus @ ^1.0.3
    jgromes/RadioLib @ 7.2.0
    ropg/LoRaWAN_ESP32 @ 1.3.0